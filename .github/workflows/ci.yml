name: ci
on:
  push: { branches: [main] }
  pull_request:
jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Version drift (Cargo.toml = src/lib.rs = wit/world.wit = CLI default)
        run: bash scripts/check-versions.sh
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: wasm32-wasip2 }
      - uses: Swatinem/rust-cache@v2
      - name: Native unit tests (parsers, PII guard, risk scoring)
        run: cargo test --target x86_64-unknown-linux-gnu --lib
      - name: Build the WASM component
        run: cargo build --target wasm32-wasip2 --release
      - name: Validate the component and print its WIT
        run: |
          cargo install wasm-tools --locked
          wasm-tools validate target/wasm32-wasip2/release/z_tenant_kyb.wasm
          wasm-tools component wit target/wasm32-wasip2/release/z_tenant_kyb.wasm
      - uses: actions/upload-artifact@v4
        with: { name: z_tenant_kyb.wasm, path: target/wasm32-wasip2/release/z_tenant_kyb.wasm }
  cli:
    runs-on: ubuntu-latest
    needs: contract
    defaults: { run: { working-directory: cli } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: z_tenant_kyb.wasm, path: target/wasm32-wasip2/release }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: cli/package-lock.json }
      - run: npm ci
      - run: npm run typecheck
      - name: CLI unit tests (vitest)
        run: npm test
      - name: Offline smoke (no keys, no network)
        run: npx tsx src/index.ts doctor --offline
